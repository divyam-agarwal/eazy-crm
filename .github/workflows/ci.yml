name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Nightly, for the NVD database refresh. 01:30 UTC is ~07:00 IST. Without this the database
  # only refreshes when someone pushes, so a quiet week reports against a stale database.
  schedule:
    - cron: '30 1 * * *'

# GITHUB_TOKEN only needs to read the repo checkout and let actions/upload-artifact write
# the failure-report artifact -- both covered by the default `contents: read` scope.
permissions:
  contents: read

# A newer push to the same ref supersedes an in-flight run -- but only for pull requests:
# on push to main this would cancel a run for a merge that has already landed, which is
# the one run you most want to finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        # The Gradle project root is backend/, not the repository root.
        working-directory: backend

    steps:
      - uses: actions/checkout@v7
        with:
          # The oasdiff step below reads the OpenAPI snapshot out of an arbitrary earlier
          # commit -- the SHA the branch was at before a push, which can be any distance back
          # (this repo has pushed 19 commits at once). A shallow clone would not contain it,
          # and the failure mode is silent: the step falls through to "nothing to compare"
          # and reports no API changes for a push that changed the API.
          fetch-depth: 0

      # Before the JDK and Gradle setup on purpose: it needs neither, and a drifted registry should
      # fail in seconds rather than after a 20-minute test run. docs/reviewers/registry.md is
      # imported into CLAUDE.md, so a stale line misdirects every agent working in the repo.
      - name: Reviewer registry matches agents
        working-directory: .
        run: scripts/check-reviewer-registry.sh

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # ubuntu-latest ships Docker preinstalled, so the Testcontainers singleton
      # Postgres container the integration tests use needs no extra setup.
      - name: Build, test and check
        run: ./gradlew clean check --no-daemon --console=plain

      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: |
            backend/build/reports/
            backend/platform/platform-primitives/build/reports/
          retention-days: 7

      # The API changelog, reported and not enforced. CI here is a post-merge smoke alarm
      # (push: [main], and this repo has never opened a pull request), so a blocking gate would
      # fail after the breaking change had already landed -- a notification with extra steps.
      # There is also no consumer yet: members management, cursor pagination and the frontend's
      # own needs will all legitimately change endpoints, so a blocking gate would fire
      # regularly, at nobody, on correct work. That is how gates get ignored.
      #
      # Flip continue-on-error to false when the frontend exists and consumes this spec. At
      # that point there is a real party to break.
      - name: API changelog (oasdiff)
        continue-on-error: true
        working-directory: .
        env:
          # HEAD~1 was wrong on both events, in different ways.
          #
          # push: HEAD~1 is the previous COMMIT, not the previous state of the branch. A push
          # carrying N commits would compare only the last one against its parent and report
          # nothing for the other N-1 -- and this repo pushes a merge commit plus its docs
          # follow-ups together as a matter of course. `github.event.before` is the SHA the
          # branch was actually at before the push, which is the comparison anyone reading
          # "what did this push do to the API" means.
          #
          # pull_request: checkout resolves the PR's MERGE ref, so the working tree is already
          # the merged result and HEAD's first parent happens to be the base tip. HEAD~1 would
          # therefore work here by accident of that default rather than by intent. Naming
          # base.sha says what is meant and survives someone setting `ref:` on the checkout.
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          # pipefail: without it, `docker run ... | tee -a "$GITHUB_STEP_SUMMARY"` exits with
          # tee's status (0) even when the docker run itself fails (bad pull, oasdiff crash,
          # daemon problem). continue-on-error already makes this step non-blocking, so a
          # silent zero there would render identically to "no API changes" in the job summary
          # -- a misreport, not just a missed alert. Each docker run below is captured and
          # checked explicitly so a tool failure says so instead of leaving a blank section.
          set -uo pipefail
          SNAPSHOT=docs/api/openapi.yaml
          # All zeros is a branch's first push -- there is no prior state to diff against.
          if [ -z "${BASE_SHA:-}" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            echo "No base commit for this event - nothing to compare." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # Covers three cases at once: the base commit is unreachable (force-push discarded
          # it), or it predates the snapshot existing, or the path was not tracked there yet.
          if ! git cat-file -e "$BASE_SHA:$SNAPSHOT" 2>/dev/null; then
            echo "No version of $SNAPSHOT at base $BASE_SHA - nothing to compare." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git show "$BASE_SHA:$SNAPSHOT" > /tmp/openapi-base.yaml
          # The step summary is rendered as Markdown, which joins consecutive lines into one
          # paragraph. oasdiff emits plain text, one finding per line, so unfenced output would
          # arrive as a single run-on blob. Each block is fenced; the fences are written
          # separately from the tool output so a tool failure still closes its fence.
          echo "## API changelog" >> "$GITHUB_STEP_SUMMARY"
          echo '```text' >> "$GITHUB_STEP_SUMMARY"
          if ! docker run --rm \
            -v /tmp/openapi-base.yaml:/base.yaml:ro \
            -v "$PWD/$SNAPSHOT:/head.yaml:ro" \
            tufin/oasdiff:v1.31.0 changelog /base.yaml /head.yaml \
            | tee -a "$GITHUB_STEP_SUMMARY"; then
            echo "oasdiff changelog failed to run -- see the step log." >> "$GITHUB_STEP_SUMMARY"
          fi
          # shellcheck disable=SC2129 # separate appends are the fencing design explained above, not an oversight
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### Breaking changes" >> "$GITHUB_STEP_SUMMARY"
          echo '```text' >> "$GITHUB_STEP_SUMMARY"
          if ! docker run --rm \
            -v /tmp/openapi-base.yaml:/base.yaml:ro \
            -v "$PWD/$SNAPSHOT:/head.yaml:ro" \
            tufin/oasdiff:v1.31.0 breaking /base.yaml /head.yaml \
            | tee -a "$GITHUB_STEP_SUMMARY"; then
            echo "oasdiff breaking failed to run -- see the step log." >> "$GITHUB_STEP_SUMMARY"
          fi
          echo '```' >> "$GITHUB_STEP_SUMMARY"

  # Supply-chain scans. A separate job from `check` on purpose: these need no JDK, no Gradle and
  # no Testcontainers, so they report in well under a minute instead of behind a 20-minute test
  # run -- and a failure here is attributable at a glance rather than buried in a Gradle log.
  #
  # These three run in CI only (spec D4). SupplyChainWorkflowTest is what stops that being a
  # silent gap: delete a step here and ./gradlew check fails.
  supply-chain:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7
        with:
          # Full history: on push and schedule gitleaks scans every commit, and a diff-only scan
          # cannot find a secret that entered three commits ago and was never removed.
          fetch-depth: 0

      - name: Secret scan (gitleaks)
        env:
          # Same resolution as the oasdiff step, and for the same reasons: on push, the SHA the
          # branch was at BEFORE the push (not HEAD~1, which is the previous commit and misses
          # N-1 of an N-commit push); on a pull request, the base branch tip.
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          # --redact: findings are printed with the secret value masked. Without it a leaked
          # credential would be re-published in a world-readable Actions log by the very tool
          # that found it.
          COMMON="-c /repo/.gitleaks.toml --redact --no-banner"
          if [ "${{ github.event_name }}" = "pull_request" ] \
             && [ -n "${BASE_SHA:-}" ] \
             && [ "$BASE_SHA" != "0000000000000000000000000000000000000000" ]; then
            echo "Scanning $BASE_SHA..HEAD"
            # shellcheck disable=SC2086 # COMMON is a deliberate flag list, not a filename
            docker run --rm -v "$PWD:/repo:ro" -w /repo \
              zricethezav/gitleaks:v8.30.1 git /repo $COMMON --log-opts="$BASE_SHA..HEAD"
          else
            echo "Scanning full history"
            # shellcheck disable=SC2086 # as above
            docker run --rm -v "$PWD:/repo:ro" -w /repo \
              zricethezav/gitleaks:v8.30.1 git /repo $COMMON
          fi

      - name: Workflow lint (actionlint)
        # Validates workflow syntax and expression types, and shellchecks every `run:` block.
        # Scans .github/workflows by default, so no path argument.
        run: |
          set -euo pipefail
          docker run --rm -v "$PWD:/repo:ro" -w /repo rhysd/actionlint:1.7.12 -color

      - name: Migration lint (squawk)
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          # Scope: migrations changed in this push or PR, never the whole directory. The 34
          # existing migrations are frozen by Flyway checksums -- editing one breaks every
          # database that has already applied it -- so a finding in one of them is a finding
          # nobody is permitted to act on. The diff is also the rule actually being enforced:
          # NEW ddl must be safe to run against a live database.
          if [ -z "${BASE_SHA:-}" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            echo "No base commit for this event - no migrations to lint."
            exit 0
          fi
          if ! git cat-file -e "$BASE_SHA" 2>/dev/null; then
            echo "Base $BASE_SHA is unreachable (force-push?) - no migrations to lint."
            exit 0
          fi
          # --diff-filter=AM: added and modified. A modified migration is itself a Flyway
          # checksum violation, so squawk flagging it is a second, cheaper alarm on a problem
          # the application would otherwise discover at startup.
          CHANGED=$(git diff --name-only --diff-filter=AM "$BASE_SHA" HEAD \
            -- 'backend/src/main/resources/db/migration/*.sql')
          if [ -z "$CHANGED" ]; then
            echo "No migrations changed in this range."
            exit 0
          fi
          echo "Linting:"
          echo "$CHANGED"
          npm install -g squawk-cli@2.65.0
          # xargs rather than an unquoted expansion: multiple paths must word-split, and doing it
          # this way keeps shellcheck (and therefore the actionlint step above) satisfied.
          # -c: squawk auto-discovers only `.squawk.toml`, and only relative to the files it
          # is linting, so the repo's config has to be named explicitly. It records which
          # rules are off for this schema and why -- see backend/squawk.toml.
          echo "$CHANGED" | xargs squawk -c backend/squawk.toml

  # Published-CVE scanning. Reports, deliberately: a CVE published overnight in a transitive
  # dependency would otherwise redden main with no code change and nobody to attribute it to --
  # the same reasoning that made the oasdiff step non-blocking. Flip continue-on-error to false
  # when branch protection exists (roadmap item 8) and findings land in a PR queue.
  dependency-check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # The NVD database is large and slow to build from cold. A miss is slow, not broken, so
      # this must never be the reason the job fails.
      - name: Cache the NVD database
        uses: actions/cache@v6
        with:
          path: backend/build/dependency-check-data
          key: nvd-${{ github.run_id }}
          restore-keys: nvd-

      - name: Dependency-Check
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: ./gradlew dependencyCheckAggregate --no-daemon --console=plain

      - name: Summarise findings
        if: always()
        run: |
          set -euo pipefail
          REPORT=build/reports/dependency-check-report.json
          echo "## Dependency-Check" >> "$GITHUB_STEP_SUMMARY"
          if [ ! -f "$REPORT" ]; then
            echo "No report produced - see the step log." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # Count vulnerable dependencies rather than raw CVEs: one bad library with forty CVEs
          # is one thing to upgrade, and a CVE count would report it as forty problems.
          COUNT=$(python3 -c "import json;d=json.load(open('$REPORT'));print(sum(1 for x in d.get('dependencies',[]) if x.get('vulnerabilities')))")
          echo "Vulnerable dependencies: **$COUNT**" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dependency-check-report
          path: backend/build/reports/dependency-check-report.*
          retention-days: 7
