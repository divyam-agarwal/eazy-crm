name: CI

on:
  push:
    branches: [main, build-hygiene] # TEMP: build-hygiene added only to test this workflow pre-merge; remove before finishing Task 6
  pull_request:

# A newer push to the same ref supersedes an in-flight run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        # The Gradle project root is backend/, not the repository root.
        working-directory: backend

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # ubuntu-latest ships Docker preinstalled, so the Testcontainers singleton
      # Postgres container the integration tests use needs no extra setup.
      - name: Build, test and check
        run: ./gradlew clean check --no-daemon --console=plain

      - name: Upload reports
        if: always() # TEMP: always upload for this verification run; revert to failure() before finishing Task 6
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: |
            backend/build/reports/
            backend/platform/platform-primitives/build/reports/
          retention-days: 7
