spring:
  application:
    name: easycrm
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/easycrm}
    username: ${DB_USER:easycrm_app}
    password: ${DB_PASSWORD:easycrm_app}
  flyway:
    enabled: true
    url: ${FLYWAY_URL:${spring.datasource.url}}
    user: ${FLYWAY_USER:easycrm_owner}
    password: ${FLYWAY_PASSWORD:easycrm_owner}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
  thymeleaf:
    suffix: .xhtml
    mode: XML
easycrm:
  jwt:
    secret: ${JWT_SECRET:0123456789-0123456789-0123456789-devsecret}
    access-ttl-seconds: 900
  # Dev-only default. A real deployment MUST set PUBLIC_BASE_URL to an https:// origin:
  # this value is prefixed onto every minted quotation share link and WhatsApped straight
  # to a customer, so a forgotten override is silent — nothing fails at startup, the bad
  # URL just shows up in the customer's chat (and http:// puts a bearer credential, the
  # share token, in the clear).
  public-base-url: ${PUBLIC_BASE_URL:http://localhost:8080}
management:
  endpoints:
    web:
      exposure:
        include: health
