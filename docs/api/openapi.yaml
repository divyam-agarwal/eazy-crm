      type: object
      properties:
        poDate:
          type: string
          format: date
        poReference:
          type: string
    ActivityCreateRequest:
      type: object
      properties:
        body:
          type: string
          maxLength: 2000
          minLength: 0
        nextFollowUp:
          $ref: "#/components/schemas/NextFollowUpRequest"
        occurredAt:
          type: string
          format: date-time
        outcome:
          type: string
          maxLength: 200
          minLength: 0
        subjectId:
          type: string
          format: uuid
        subjectType:
          type: string
          enum:
          - CUSTOMER
          - ENQUIRY
          - QUOTATION
          - ORDER
        type:
          type: string
          enum:
          - CALL
          - WHATSAPP
          - EMAIL
          - VISIT
          - NOTE
      required:
      - subjectId
