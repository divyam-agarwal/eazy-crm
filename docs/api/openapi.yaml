openapi: 3.1.0
info:
  description: |-
    Multi-tenant CRM for Indian distributors, traders and small manufacturers. Scope stops at the Order: no invoicing, stock or ledger.

    Every route under /api/** requires a bearer JWT except the auth routes, the invitation accept/preview pair, and GET /public/q/{token}. Money is carried as a JSON string, never a number. Errors share one envelope: {"error":{"code","message","fields"}}.
  title: EasyCRM API
  version: 0.0.1-SNAPSHOT
servers:
- description: Generated server url
  url: http://localhost
security:
- bearer-jwt: []
